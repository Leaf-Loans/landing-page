name: Deploy

# Manual-only deploy of the static site to AWS (S3 + CloudFront).
# Pick the environment when running. Prod deploys must run from `main`
# (the prod OIDC role only trusts main).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [uat, prod]
        default: uat

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "ROLE_ARN=arn:aws:iam::766534057479:role/leafloans-gha-deploy" >> "$GITHUB_ENV"
            echo "BUCKET=leafloans-landing-prod" >> "$GITHUB_ENV"
            echo "DIST_ID=E2RPK6AR8VTB6Y" >> "$GITHUB_ENV"
          else
            echo "ROLE_ARN=arn:aws:iam::766534057479:role/leafloans-gha-deploy-uat" >> "$GITHUB_ENV"
            echo "BUCKET=leafloans-landing-uat" >> "$GITHUB_ENV"
            echo "DIST_ID=EFISRGWDZ6BW" >> "$GITHUB_ENV"
          fi

      - name: Guard prod to main
        if: ${{ inputs.environment == 'prod' && github.ref != 'refs/heads/main' }}
        run: echo "::error::prod deploys must run from main" && exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-south-1

      - name: Sync static site to S3
        run: |
          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "docs/*" \
            --exclude "scripts/*" \
            --exclude "CLAUDE.md" \
            --exclude "DESIGN_SYSTEM.md" \
            --exclude "apply.js"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
